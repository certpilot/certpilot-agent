name: Release

# Tags only.
#
# Building still happens on every pull request, in ci.yml, which is where a
# broken Dockerfile should be caught. Only publishing is tied to a tag, so
# `latest` means the most recent release rather than the most recent merge — a
# `docker compose pull` should not change what a deployment runs because
# somebody merged a paragraph of documentation.
#
# workflow_dispatch stays for republishing a tag whose run failed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest

    # The image name does not change with the repository.
    #
    # This was published as ghcr.io/certpilot/agent by a job in the core's
    # repository that built three images together. Anything pulling it today
    # keeps working: same name, same tags, new source. A rename would have been
    # a breaking change for every deployment, bought nothing, and been
    # discovered by whoever ran `docker compose pull` next.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/certpilot/agent
          # latest=auto attaches `latest` to a semver tag and to nothing else,
          # so a prerelease or a manual run from a branch cannot claim it.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both architectures, because the machines people run this on are
          # increasingly not amd64. The Dockerfile cross-compiles from the build
          # platform rather than being emulated — Go does that natively with CGO
          # off, and QEMU would spend minutes producing an identical binary.
          platforms: linux/amd64,linux/arm64
          # The version the binary reports about itself. steps.meta gives the
          # tag without its leading v, and empty for a manual branch run — which
          # is what the Dockerfile treats as "do not stamp", leaving the -dev
          # default rather than a release number this build is not.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
